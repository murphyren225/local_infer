<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Client</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1c2330; --muted:#6b7686; --accent:#2563eb; --agent:#7c3aed; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header .gw { font-size:12px; color:var(--muted); flex:1; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:1px solid var(--line); background:var(--card); padding:5px 12px; border-radius:8px; font:inherit; cursor:pointer; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
  #msgs { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:76%; margin-bottom:14px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { margin-left:auto; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.user.agent { background:var(--agent); }
  .msg.bot  { background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; font-family:inherit; }
  .msg.bot.agent { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
  .meta { font-size:11px; color:var(--muted); margin:-8px 0 14px 4px; }
  .meta b { color:var(--accent); }
  #inputrow { display:flex; gap:8px; padding:12px 18px; background:var(--card); border-top:1px solid var(--line); align-items:flex-end; flex-wrap:wrap; }
  #prompt { flex:1 1 100%; resize:none; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; height:64px; }
  select,button,input { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); padding:8px 12px; }
  #cwd { flex:1; min-width:180px; display:none; }
  body.agent #cwd { display:block; }
  #send { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; cursor:pointer; margin-left:auto; }
  body.agent #send { background:var(--agent); border-color:var(--agent); }
  #send:disabled { opacity:.5; cursor:wait; }
  .hint { flex:1 1 100%; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Cluster Client</h1>
  <span class="gw" id="gw">connecting…</span>
  <div class="tabs">
    <button id="newchat" title="Start a new conversation (new session on the model side)">New chat</button>
    <button id="tab-chat" class="on" title="One inference call on the model side; nothing runs on this machine">Chat</button>
    <button id="tab-agent" title="Pi harness on this machine: reads/writes files, runs commands; the model side only answers">Agent</button>
  </div>
</header>
<div id="msgs"></div>
<div id="inputrow">
  <textarea id="prompt" placeholder="Ask the cluster… (Enter to send, Shift+Enter for newline)"></textarea>
  <select id="model">
    <option value="auto" selected>auto</option>
    <option value="small">small</option>
    <option value="large">large</option>
    <option value="cloud">cloud</option>
  </select>
  <input id="cwd" placeholder="working directory for the agent, e.g. ~/work" value="~">
  <button id="send">Send</button>
  <div class="hint" id="hint">Chat: the prompt goes to the model side and the answer comes back. Nothing runs here.</div>
</div>
<script>
const $ = id => document.getElementById(id);
let history = [], mode = "chat", agentAvailable = false, token = "", session = newSession();
function newSession() { return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).replace(/-/g, "").slice(0, 16); }
$("newchat").onclick = () => { history = []; session = newSession(); $("msgs").innerHTML = ""; };
fetch("/api/config").then(r => r.json()).then(c => {
  agentAvailable = !!c.agent; token = c.token || "";
  $("gw").textContent = "model side " + c.gateway + (agentAvailable ? " · pi ready" : " · pi not installed (Agent tab disabled)");
}).catch(() => $("gw").textContent = "local service not reachable");

function setMode(m) {
  mode = m; document.body.classList.toggle("agent", m === "agent");
  $("tab-chat").classList.toggle("on", m === "chat"); $("tab-agent").classList.toggle("on", m === "agent");
  $("hint").textContent = m === "agent"
    ? "Agent: Pi runs on this machine with real tools (files, shell) in the working directory; the model side only answers. One task per message."
    : "Chat: the prompt goes to the model side and the answer comes back. Nothing runs here.";
  $("prompt").placeholder = m === "agent" ? "Give the agent a task… e.g. 'list the largest 5 files here and write them to big.txt'" : "Ask the cluster… (Enter to send, Shift+Enter for newline)";
}
$("tab-chat").onclick = () => setMode("chat");
$("tab-agent").onclick = () => { if (!agentAvailable) { alert("pi is not installed on this machine"); return; } setMode("agent"); };

function add(role, text, cls) {
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "bot") + (cls ? " " + cls : "");
  d.textContent = text; $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight; return d;
}
function meta(html) { const m = document.createElement("div"); m.className = "meta"; m.innerHTML = html; $("msgs").appendChild(m); }

async function send() {
  const text = $("prompt").value.trim(); if (!text) return;
  $("prompt").value = ""; $("send").disabled = true;
  if (mode === "agent") {
    add("user", text, "agent");
    const bot = add("bot", "… agent running on this machine", "agent");
    try {
      const r = await fetch("/api/agent", { method: "POST", headers: { "Content-Type": "application/json", "X-Client-Token": token },
        body: JSON.stringify({ task: text, lane: $("model").value, cwd: $("cwd").value }) });
      const d = await r.json();
      bot.textContent = d.error ? "❌ " + d.error : (d.output || "(no output)");
      if (!d.error) meta(`agent · pi on this machine · cwd ${d.cwd} · ${(d.latency_ms/1000).toFixed(1)}s · exit ${d.exit}`);
    } catch (e) { bot.textContent = "❌ " + e; }
  } else {
    add("user", text); history.push({ role: "user", content: text });
    const bot = add("bot", "… generating");
    try {
      const r = await fetch("/v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json", "x-switchyard-session-id": session },
        body: JSON.stringify({ model: $("model").value, messages: history.slice(-8), max_tokens: 1024 }) });
      const d = await r.json();
      if (!d.choices) { bot.textContent = "❌ " + JSON.stringify(d.error || d).slice(0, 200); }
      else {
        const ans = d.choices[0].message.content || "(empty)";
        bot.textContent = ans; history.push({ role: "assistant", content: ans });
        const ms = (d._client || {}).latency_ms, tok = (d.usage || {}).completion_tokens;
        meta(`served by <b>${d.model}</b>` + (ms ? ` · ${(ms/1000).toFixed(1)}s` : "") + (tok ? ` · ${tok} tok` : "") + ` · session ${session.slice(0,6)}`);
      }
    } catch (e) { bot.textContent = "❌ " + e; }
  }
  $("send").disabled = false;
}
$("send").onclick = send;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
