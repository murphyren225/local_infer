<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Client</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1c2330; --muted:#6b7686; --accent:#2563eb; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 18px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header .gw { font-size:12px; color:var(--muted); }
  #msgs { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:76%; margin-bottom:14px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { margin-left:auto; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot  { background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .meta { font-size:11px; color:var(--muted); margin:-8px 0 14px 4px; }
  .meta b { color:var(--accent); }
  #inputrow { display:flex; gap:8px; padding:12px 18px; background:var(--card); border-top:1px solid var(--line); align-items:flex-end; }
  #prompt { flex:1; resize:none; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; height:64px; }
  select,button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); padding:8px 12px; cursor:pointer; }
  #send { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  #send:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>Cluster Client</h1>
  <span class="gw" id="gw">connecting…</span>
</header>
<div id="msgs"></div>
<div id="inputrow">
  <textarea id="prompt" placeholder="Ask the cluster… (Enter to send, Shift+Enter for newline)"></textarea>
  <select id="model">
    <option value="auto" selected>auto</option>
    <option value="small">small</option>
    <option value="large">large</option>
    <option value="cloud">cloud</option>
  </select>
  <button id="send">Send</button>
</div>
<script>
const $ = id => document.getElementById(id);
let history = [];
fetch("/api/config").then(r => r.json()).then(c => $("gw").textContent = "gateway " + c.gateway).catch(() => $("gw").textContent = "local server not reachable");

function add(role, text) {
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text; $("msgs").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight; return d;
}
async function send() {
  const text = $("prompt").value.trim(); if (!text) return;
  add("user", text); history.push({ role: "user", content: text });
  $("prompt").value = ""; $("send").disabled = true;
  const bot = add("bot", "… generating");
  try {
    const r = await fetch("/v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, messages: history.slice(-8), max_tokens: 1024 }) });
    const d = await r.json();
    if (!d.choices) { bot.textContent = "❌ " + JSON.stringify(d.error || d).slice(0, 200); }
    else {
      const ans = d.choices[0].message.content || "(empty)";
      bot.textContent = ans; history.push({ role: "assistant", content: ans });
      const ms = (d._client || {}).latency_ms, tok = (d.usage || {}).completion_tokens;
      const m = document.createElement("div"); m.className = "meta";
      m.innerHTML = `served by <b>${d.model}</b>` + (ms ? ` · ${(ms/1000).toFixed(1)}s` : "") + (tok ? ` · ${tok} tok` : "");
      $("msgs").appendChild(m);
    }
  } catch (e) { bot.textContent = "❌ " + e; }
  $("send").disabled = false;
}
$("send").onclick = send;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
</body>
</html>
