name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Unit tests (router, cache, escalation)
        run: PYTHONPATH=gateway python -m pytest gateway/tests -q
      - name: Routing eval gate (accuracy >= 90%)
        run: python evals/run_evals.py --min-accuracy 0.9
