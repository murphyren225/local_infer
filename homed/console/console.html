<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Cluster Console</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1c2330; --muted:#6b7686;
          --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 18px;
           background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  .badge { padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; }
  .badge.normal { background:#e7f6ec; color:var(--ok); }
  .badge.degraded { background:#fdf0e0; color:var(--warn); }
  .badge.dead { background:#fde8e8; color:var(--bad); }
  .lane { font-size:12px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  main { flex:1; display:flex; min-height:0; }
  #chatcol { flex:1; display:flex; flex-direction:column; min-width:0; }
  #msgs { flex:1; overflow-y:auto; padding:18px; }
  .msg { max-width:76%; margin-bottom:14px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { margin-left:auto; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot  { background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .meta { font-size:11px; color:var(--muted); margin:-8px 0 14px 4px; }
  .meta b { color:var(--accent); font-weight:600; }
  #inputrow { display:flex; gap:8px; padding:12px 18px; background:var(--card); border-top:1px solid var(--line); align-items:flex-end; }
  #prompt { flex:1; resize:none; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; height:64px; }
  select,button { font:inherit; border-radius:10px; border:1px solid var(--line); background:var(--card); padding:8px 12px; cursor:pointer; }
  #send { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  #send:disabled { opacity:.5; cursor:wait; }
  #filechip { font-size:12px; color:var(--accent); padding:2px 18px 6px; display:none; }
  aside { width:320px; border-left:1px solid var(--line); background:var(--card); overflow-y:auto; padding:14px; }
  aside h2 { font-size:13px; margin:14px 0 6px; color:var(--muted); }
  aside h2:first-child { margin-top:0; }
  .panel { font-size:13px; background:var(--bg); border-radius:10px; padding:10px 12px; }
  .esc { border-left:3px solid var(--warn); padding:6px 8px; margin-bottom:6px; background:#fffaf2; border-radius:0 8px 8px 0; font-size:12px; }
  .esc time { color:var(--muted); display:block; font-size:11px; }
  .statrow { display:flex; justify-content:space-between; padding:2px 0; }
  .statrow b { font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); font-size:12px; }
  @media (max-width:800px){ aside{display:none;} }
</style>
</head>
<body>
<header>
  <h1>🖥️ AI Cluster Console</h1>
  <span id="mode" class="badge normal">…</span>
  <span class="lane"><span id="dot-large" class="dot bad"></span>Large 32B</span>
  <span class="lane"><span id="dot-small" class="dot bad"></span>Small 1.7B</span>
</header>
<main>
  <div id="chatcol">
    <div id="msgs"></div>
    <div id="filechip"></div>
    <div id="inputrow">
      <button id="attach" title="Upload a text file (txt/md/csv/json/code)">📎</button>
      <input id="file" type="file" hidden>
      <textarea id="prompt" placeholder="Give the cluster a task… (Enter to send, Shift+Enter for newline)"></textarea>
      <select id="model">
        <option value="auto" selected>auto · smart triage</option>
        <option value="small">small · 1.7B front desk</option>
        <option value="large">large · 32B expert</option>
        <option value="cloud">cloud · fallback</option>
      </select>
      <button id="send">Send</button>
    </div>
  </div>
  <aside>
    <h2>🧭 Router policy right now</h2>
    <div id="routing" class="panel">Loading…</div>
    <h2>⬆️ Escalations (judge verdicts)</h2>
    <div id="escalations"><div class="empty">No escalations yet</div></div>
    <h2>📊 Cumulative stats</h2>
    <div id="stats" class="panel"></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let history = [], pendingFile = null;

const MODE_TEXT = {
  "normal": ["normal", "Normal · smart triage", "auto lane: every request is answered by the <b>1.7B small model</b> first; a judge reviews the answer and <b>escalates the session to the 32B</b> when the task is out of its depth. Explicit small/large/cloud lanes go direct."],
  "degraded-large-cloud": ["degraded", "Degraded · large→cloud", "The local 32B is down. auto and large now go to the <b>cloud API</b>; the small model is unaffected. The watchdog is reloading the 32B in the background and will switch back automatically."],
  "degraded-large-small": ["degraded", "Degraded · large→small", "The local 32B is down and no cloud key is configured. auto/large are temporarily served by the <b>1.7B</b> (reduced quality). The watchdog is reloading the 32B."],
  "degraded-small-cloud": ["degraded", "Degraded · small→cloud", "The small model is down; its lane is served by the cloud while the 32B runs normally. Self-healing in the background."],
  "degraded-small-large": ["degraded", "Degraded · small→large", "The small model is down; its requests are handled by the 32B for now. Self-healing in the background."],
  "degraded-all-cloud": ["degraded", "Degraded · all→cloud", "Both local models are down; all traffic is going to the <b>cloud API</b>. Self-healing in the background."],
  "dead": ["dead", "Service unavailable", "All local lanes are down and no cloud key is set. Run ./homed/run_cluster.sh on the server."],
};

function addMsg(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  d.textContent = text;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}
function addMeta(html) {
  const d = document.createElement("div");
  d.className = "meta"; d.innerHTML = html;
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

async function send() {
  let text = $("prompt").value.trim();
  if (!text && !pendingFile) return;
  let shown = text || "(analyze the uploaded file)";
  addMsg("user", (pendingFile ? `📄 ${pendingFile.name}\n` : "") + shown);
  let content = text;
  if (pendingFile) {
    content = `Here is the content of the file "${pendingFile.name}"${pendingFile.truncated ? " (truncated)" : ""}:\n---\n${pendingFile.text}\n---\n\n${text || "Please summarize the key points of this file."}`;
    pendingFile = null; $("filechip").style.display = "none";
  }
  history.push({ role: "user", content });
  $("prompt").value = ""; $("send").disabled = true;
  const thinking = addMsg("bot", "… generating (large models can take 30–60s)");
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, messages: history.slice(-8), max_tokens: 1024 }),
    });
    const d = await r.json();
    if (d.error || !d.choices) {
      thinking.textContent = "❌ " + (typeof d.error === "string" ? d.error : JSON.stringify(d.error || d).slice(0, 200));
    } else {
      const ans = d.choices[0].message.content || "(empty answer)";
      thinking.textContent = ans;
      history.push({ role: "assistant", content: ans });
      const u = d.usage || {}, ms = (d._console || {}).latency_ms;
      addMeta(`served by <b>${d.model}</b> · latency ${ms ? (ms/1000).toFixed(1) : "?"}s` +
              (u.completion_tokens ? ` · ${u.completion_tokens} tok (${ms ? Math.round(u.completion_tokens/(ms/1000)) : "?"} tok/s)` : ""));
    }
  } catch (e) { thinking.textContent = "❌ Request failed: " + e; }
  $("send").disabled = false; refresh();
}

$("send").onclick = send;
$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("attach").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  const r = await fetch("/api/upload", { method: "POST", body: fd });
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  pendingFile = d;
  $("filechip").textContent = `📄 Attached: ${d.name} (${d.chars} chars${d.truncated ? ", truncated" : ""}) — type what to do with it below, or just hit Send for a summary`;
  $("filechip").style.display = "block";
  $("file").value = "";
};

async function refresh() {
  try {
    const d = await (await fetch("/api/status")).json();
    const [cls, label, desc] = MODE_TEXT[d.mode] || ["degraded", d.mode, "Unknown mode"];
    $("mode").className = "badge " + cls; $("mode").textContent = label;
    $("routing").innerHTML = desc;
    $("dot-large").className = "dot " + (d.lanes.large ? "ok" : "bad");
    $("dot-small").className = "dot " + (d.lanes.small ? "ok" : "bad");
    const s = d.stats || {};
    $("stats").innerHTML =
      `<div class="statrow"><span>Requests routed</span><b>${s.requests ?? "-"}</b></div>` +
      `<div class="statrow"><span>Total tokens</span><b>${s.tokens ?? "-"}</b></div>` +
      `<div class="statrow"><span>Upstream errors</span><b>${s.errors ?? "-"}</b></div>`;
    if (d.escalations && d.escalations.length) {
      $("escalations").innerHTML = d.escalations.slice().reverse().map(e =>
        `<div class="esc"><time>${e.time}</time>${e.detail}</div>`).join("");
    }
  } catch (e) { /* status refresh failures shouldn't disturb the chat */ }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
