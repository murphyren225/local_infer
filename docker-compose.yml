# Tandem: two vLLM instances share one GPU + a routing gateway in front.
# Model choices and memory fractions come from .env, written by
# autotune/autotune.py — run that first (or copy .env.example).
services:
  vllm-large:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.10.1.1}
    command: >
      --model ${LARGE_MODEL:-Qwen/Qwen3-32B-AWQ}
      --revision ${LARGE_REVISION:-main}
      --gpu-memory-utilization ${LARGE_GPU_UTIL:-0.83}
      --max-model-len ${LARGE_MAX_LEN:-6144}
      --kv-cache-dtype ${LARGE_KV_DTYPE:-fp8}
      --max-num-seqs ${LARGE_MAX_SEQS:-16}
      --max-num-batched-tokens ${LARGE_MAX_BATCHED:-2048}
      --enforce-eager
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60          # model download + load can take a long while
      start_period: 300s
    restart: unless-stopped

  vllm-small:
    image: vllm/vllm-openai:${VLLM_VERSION:-v0.10.1.1}
    command: >
      --model ${SMALL_MODEL:-Qwen/Qwen3-1.7B-FP8}
      --revision ${SMALL_REVISION:-main}
      --gpu-memory-utilization ${SMALL_GPU_UTIL:-0.11}
      --max-model-len ${SMALL_MAX_LEN:-4096}
      --kv-cache-dtype ${SMALL_KV_DTYPE:-fp8}
      --max-num-seqs ${SMALL_MAX_SEQS:-8}
      --max-num-batched-tokens ${SMALL_MAX_BATCHED:-512}
      --enforce-eager
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 180s
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
    environment:
      - TANDEM_CONFIG=/app/config/tandem.yaml
    depends_on:
      vllm-large:
        condition: service_healthy
      vllm-small:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
